name: psyche

# MongoDB는 STEP 2(MongoDB Atlas 전환)부터 로컬 컨테이너 대신 Atlas 클러스터를 사용한다.
# 로컬에는 Redis(BullMQ 큐용)만 기동하면 된다.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  redis_data:
